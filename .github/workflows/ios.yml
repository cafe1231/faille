name: iOS

on:
  push:
    # main, et les branches de travail des lots menés en parallèle (fin/…, fonc/…) : elles ont leur CI iOS avant fusion.
    branches: [main, 'fin/**', 'fonc/**']
  workflow_dispatch:

permissions:
  contents: read

# Seul le dernier commit d'une branche compte : un push plus récent annule la vérification en cours (il contient tout).
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Si ce label n'existe pas sur GitHub, utiliser macos-latest.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Générer le projet Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compiler sans signature
        run: |
          xcodebuild -project Faille.xcodeproj -scheme Faille -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Vérifier Sora et les icônes dans l'extension
        # Le widget a son propre bundle : sans police ni catalogue embarqués, il retomberait sur la police système.
        run: |
          APPEX=build/Build/Products/Release-iphoneos/Faille.app/PlugIns/FailleWidgets.appex
          ls "$APPEX"
          test -f "$APPEX/Sora-Variable.ttf"
          test -f "$APPEX/Assets.car"
          /usr/libexec/PlistBuddy -c "Print :UIAppFonts:0" "$APPEX/Info.plist" | grep -qx "Sora-Variable.ttf"
          # Réglages du petit widget (AppIntent) : métadonnées extraites à la compilation.
          ls "$APPEX/Metadata.appintents" || echo "::warning::Metadata.appintents absent de l'extension : le choix d'équipe du petit widget risque de manquer"

      - name: Vérifier l'Info.plist de l'appli (Live Activities, arrière-plan, icône)
        # Sans ces clés, iOS refuse les Live Activities ou ne réveille jamais l'appli en arrière-plan (spec §6.4).
        # Icône (finitions §1) : actool n'inscrit CFBundleIcons que si le catalogue contient le jeu AppIcon.
        run: |
          APP=build/Build/Products/Release-iphoneos/Faille.app
          PLIST="$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" "$PLIST" | grep -qx true
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" | grep -q fetch
          /usr/libexec/PlistBuddy -c "Print :BGTaskSchedulerPermittedIdentifiers" "$PLIST" | grep -q faille.live-refresh
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$PLIST" | grep -qx AppIcon
          ls "$APP"/AppIcon*.png || echo "::warning::aucun PNG AppIcon* à la racine de l'appli : l'icône n'est que dans Assets.car"

      - name: Signer en ad hoc avec les entitlements
        # AltServer re-signe ensuite avec l'Apple ID de Dan ; il lit les entitlements embarqués ici.
        run: |
          APP=build/Build/Products/Release-iphoneos/Faille.app
          codesign --force --sign - --entitlements Widgets/FailleWidgets.entitlements "$APP/PlugIns/FailleWidgets.appex"
          codesign --force --sign - --entitlements App/Faille.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>&1 | tee app-entitlements.txt
          codesign -d --entitlements - "$APP/PlugIns/FailleWidgets.appex" 2>&1 | tee widget-entitlements.txt
          # Sans groupe d'apps embarqué, AltServer n'en crée pas : l'appli et le widget ne partageraient rien.
          grep -q application-groups app-entitlements.txt
          grep -q application-groups widget-entitlements.txt

      - name: Empaqueter l'IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Faille.app Payload/
          zip -qry Faille.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Faille-ipa
          path: Faille.ipa
          retention-days: 14

  apercus:
    # Tests de l'appli sur simulateur (store, aperçus) : les écrans en PNG dans l'artefact Faille-apercus.
    runs-on: macos-26
    # Un simulateur qui ne démarre pas ne doit pas bloquer le runner pendant les 6 h par défaut.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Générer le projet Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Choisir un simulateur iPhone sous le dernier iOS (26 au minimum)
        id: sim
        run: |
          xcrun simctl list runtimes
          # Runtime iOS le plus récent disponible : tri par version numérique (26-10 après 26-2), pas le premier de la
          # liste ; toujours iOS 26 au minimum. Une ligne : UDID, runtime, nom de l'appareil (séparés par des tabulations).
          CHOICE=$(xcrun simctl list --json devices available | jq -r '
            [.devices | to_entries[]
             | (.key | capture("SimRuntime[.]iOS-(?<v>[0-9]+(-[0-9]+)*)$")) as $m
             | ($m.v | split("-") | map(tonumber)) as $version
             | select($version[0] >= 26)
             | .key as $runtime
             | .value[] | select(.name | startswith("iPhone"))
             | {runtime: $runtime, version: $version, name: .name, udid: .udid}]
            | sort_by(.version) | (last // empty)
            | "\(.udid)\t\(.runtime)\t\(.name)"')
          if [ -z "$CHOICE" ]; then
            xcrun simctl list devices available
            echo "Aucun simulateur iPhone iOS 26+ disponible" >&2
            exit 1
          fi
          UDID=$(printf '%s' "$CHOICE" | cut -f1)
          RUNTIME=$(printf '%s' "$CHOICE" | cut -f2)
          NAME=$(printf '%s' "$CHOICE" | cut -f3)
          echo "Runtime choisi : ${RUNTIME#com.apple.CoreSimulator.SimRuntime.} · $NAME · $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Tests et aperçus
        run: |
          xcodebuild test -project Faille.xcodeproj -scheme Faille \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/test \
            CODE_SIGNING_ALLOWED=NO

      - name: Lister les aperçus
        if: always()
        run: ls -la build/apercus || echo "aucun aperçu"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Faille-apercus
          path: build/apercus/*.png
          if-no-files-found: warn
          retention-days: 14
