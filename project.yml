name: Faille
options:
  bundleIdPrefix: com.cafe1231
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  LoLKit:
    path: LoLKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  Faille:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Resources
    dependencies:
      - target: FailleWidgets
      - package: LoLKit
    scheme:
      testTargets:
        - FailleTests
    entitlements:
      path: App/Faille.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cafe1231.faille
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Faille
        CFBundleShortVersionString: "0.1.0"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - Sora-Variable.ttf
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cafe1231.faille
        # Appli en Swift 6 (concurrence stricte) ; l'extension reste en Swift 5 jusqu'à l'étape 3.
        SWIFT_VERSION: "6.0"
        # Pas d'icône d'appli ni de couleur d'accent dans le catalogue à l'étape 2 : actool ne doit pas les chercher.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
      configs:
        Debug:
          # Les tests hébergés utilisent du code de LoLKit lié dans l'appli : on ne l'élague pas en Debug.
          DEAD_CODE_STRIPPING: "NO"
  FailleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
      # Sora et les icônes (spec §7, §9) : l'extension a son propre bundle, elle ne voit pas les ressources de l'appli.
      - Resources
    dependencies:
      - package: LoLKit
    entitlements:
      path: Widgets/FailleWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cafe1231.faille
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Faille
        CFBundleShortVersionString: "0.1.0"
        UIAppFonts:
          - Sora-Variable.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cafe1231.faille.widgets
        # Pas d'icône ni de couleur d'accent dans le catalogue : actool ne doit pas les chercher.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
  FailleTests:
    # Tests hébergés dans l'appli (police, catalogue et scène disponibles) ; Swift Testing.
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/FailleTests
    dependencies:
      - target: Faille
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cafe1231.faille.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Faille.app/Faille"
        BUNDLE_LOADER: "$(TEST_HOST)"
