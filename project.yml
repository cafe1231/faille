name: Faille
options:
  bundleIdPrefix: com.cafe1231
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  LoLKit:
    path: LoLKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  Faille:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: FailleWidgets
      - package: LoLKit
    scheme: {}
    entitlements:
      path: App/Faille.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cafe1231.faille
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Faille
        CFBundleShortVersionString: "0.1.0"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cafe1231.faille
        # Appli en Swift 6 (concurrence stricte) ; l'extension reste en Swift 5 jusqu'à l'étape 3.
        SWIFT_VERSION: "6.0"
  FailleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    dependencies:
      - package: LoLKit
    entitlements:
      path: Widgets/FailleWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cafe1231.faille
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Faille
        CFBundleShortVersionString: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cafe1231.faille.widgets
